[project]
name = "argmin"
version = "0.1.0"
description = "Argmin — reproducible portfolio optimization & walk-forward backtesting engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Argmin" }]

dependencies = [
    # DataFrames / columnar store
    "polars>=1.17,<2.0",
    "duckdb>=1.1,<2.0",
    "pyarrow>=18.0",
    # Numerics / optimization
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "cvxpy>=1.5",
    "clarabel>=0.9",
    "osqp>=0.6",
    # ML / stats
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # Config / quality / logging
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.4",
    # Service / CLI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    # Parallel backtest
    "joblib>=1.4",
    # Figures for CLI tearsheet
    "matplotlib>=3.9",
    # Data source (one-time snapshot fetch only; NOT used in tests/CI)
    "yfinance>=0.2.50",
]

[project.scripts]
argmin = "argmin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argmin"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "httpx>=0.27",          # FastAPI TestClient
]
# Test oracles ONLY — never shipped as the implementation (spec §2.1).
# Isolated so a flaky install here can't block core ruff/mypy/pytest.
oracles = [
    "pyportfolioopt>=1.5.5",
    "quantstats>=0.0.62",
]

[tool.uv]
default-groups = ["dev"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",  # too many arguments — common in numerical/optimizer signatures
    "PLR2004",  # magic values — pervasive in math/test code
    "RUF001",   # ambiguous unicode in strings — we use real math symbols (μ, Σ, σ, ρ)
    "RUF002",   # ambiguous unicode in docstrings — equations are first-class here
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N806", "N803"]
# Allow math-style uppercase names (R, Sigma, P, Q) in numerical modules.
"src/argmin/estimators/**" = ["N803", "N806"]
"src/argmin/optimizers/**" = ["N803", "N806"]
"src/argmin/backtest/**" = ["N803", "N806"]
"src/argmin/analytics/**" = ["N803", "N806"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "cvxpy", "cvxpy.*", "sklearn.*", "scipy", "scipy.*", "statsmodels.*",
    "yfinance.*", "joblib.*", "matplotlib.*", "matplotlib", "duckdb.*",
    "pypfopt.*", "quantstats.*", "pandas.*", "pandas",
]
# These libs are untyped or only partially typed — treat them as Any so the
# engine's own strict typing isn't blocked by upstream attribute gaps.
ignore_missing_imports = true
follow_imports = "skip"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
