<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Argmin">
  <!--
    Argmin mark: a leaning "A" where the right flank is an amber *descent* down the
    slope to the minimizer dot at its foot — argmin, drawn. The ink strokes flip
    for light/dark browser chrome; the amber signal + minimizer read on both.
    Transparent background.
  -->
  <style>
    .ink { stroke: #14171c; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #e8eaed; } }
  </style>
  <g fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <path class="ink" d="M6.5 25.5 L15.5 6.5" />
    <path class="ink" d="M9.8 18.5 H21.8" />
    <path d="M15.5 6.5 L25 25" stroke="#e6a94d" />
  </g>
  <!-- minimizer: a beacon where the descent lands (echoes the tangency pulse) -->
  <circle cx="25" cy="25" r="4.2" fill="#e6a94d" opacity="0.16" />
  <circle cx="25" cy="25" r="2.6" fill="#e6a94d" />
</svg>
